<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mini Studio</title>
<style>
*{box-sizing:border-box}html{background:#000;color:#fff}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;padding:24px}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:1px solid #fff;padding-bottom:10px;margin-bottom:16px}.top h1{font-size:21px;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin:0}.sub,.hint,.label{font-size:11px;color:#888;letter-spacing:.55px;text-transform:uppercase}.panel{border:1px solid #fff;padding:14px;margin-bottom:14px}.panel h2{font-size:12px;color:#999;letter-spacing:1px;text-transform:uppercase;margin:0 0 10px}.guide{border:1px solid #555;margin-bottom:14px}.guide summary{padding:12px;cursor:pointer;font-size:12px;letter-spacing:.7px;text-transform:uppercase}.guide-body{padding:0 12px 12px;color:#aaa;font-size:12px;line-height:1.6}.guide-body code{color:#fff;background:#151515;padding:1px 4px}.tracks{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.track{min-width:0}.track-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.count{font:11px monospace;color:#777}.count.bad{color:#fff;text-decoration:underline}textarea,input,select{width:100%;border:1px solid #777;border-radius:0;background:#000;color:#fff;outline:none;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}textarea{height:260px;resize:vertical;padding:10px}textarea:focus,input:focus,select:focus{border-color:#fff}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;margin-bottom:5px}.field select,.field input{height:42px;padding:8px;font-family:inherit}.mixer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mix{border:1px solid #444;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;cursor:pointer}.mix input{width:20px;height:20px;accent-color:#fff}.transport{position:sticky;bottom:0;background:rgba(0,0,0,.94);border:1px solid #fff;padding:10px;z-index:5;backdrop-filter:blur(8px)}.buttons{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}button{min-height:44px;border:1px solid #fff;background:#000;color:#fff;text-transform:uppercase;letter-spacing:.8px;cursor:pointer}button:hover:not(:disabled){background:#fff;color:#000}button:disabled{color:#555;border-color:#444}.recording{background:#fff;color:#000}.progress{height:3px;background:#222;margin-top:10px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:#fff;transition:width .1s linear}.monitor{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:12px ui-monospace,monospace;color:#999}.monitor strong{color:#fff;font-weight:500}.error{display:none;margin-top:8px;font-size:12px;color:#fff}.error.show{display:block}.saved{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:760px){body{padding:12px}.app{margin:0}.top{align-items:start}.tracks{grid-template-columns:1fr}.track textarea{height:150px}.settings{grid-template-columns:1fr 1fr}.mixer{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:1fr 1fr}.buttons #record{grid-column:1/-1}.transport{bottom:0}.monitor{font-size:11px}.panel{padding:11px}}
@media(max-width:390px){.settings,.mixer{grid-template-columns:1fr}.sub{display:none}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Mini Studio</h1><div class="sub">Browser audio sequencer</div></div><div class="saved" id="saved">Local autosave</div></header>
<details class="guide"><summary>How to / Cheatsheet</summary><div class="guide-body">Keep Lyrics, Beats and Pitch aligned item-by-item. Beats: <code>0.25</code>, <code>0.5</code>, <code>1</code>, <code>2</code>, <code>4</code>. Pitch: <code>L</code>, <code>M</code>, <code>H</code>, or <code>do re mi fa so la di</code>. Use <code>_</code> for a vocal rest.</div></details>
<section class="panel"><h2>Tracks</h2><div class="tracks">
<div class="track"><div class="track-head"><span class="label">Lyrics</span><span class="count" id="lyricsCount">0</span></div><textarea id="lyrics" placeholder="neon&#10;lights&#10;_&#10;glow&#10;soft"></textarea></div>
<div class="track"><div class="track-head"><span class="label">Beats</span><span class="count" id="beatsCount">0</span></div><textarea id="beats" placeholder="1&#10;1&#10;2&#10;1&#10;4"></textarea></div>
<div class="track"><div class="track-head"><span class="label">Pitch</span><span class="count" id="pitchCount">0</span></div><textarea id="pitch" placeholder="H&#10;M&#10;L&#10;do&#10;mi"></textarea></div>
</div><div class="error" id="error"></div></section>
<section class="panel"><h2>Sound</h2><div class="settings">
<div class="field"><label class="label">Genre</label><select id="genre"><option value="pop">Pop · 120 BPM</option><option value="hiphop">Hip-Hop · 90 BPM</option><option value="rock">Rock · 135 BPM</option><option value="lofi">Lo-Fi · 75 BPM</option><option value="synthwave">Synthwave · 110 BPM</option><option value="dnb">Drum & Bass · 174 BPM</option><option value="neosoul">Neo-Soul · 84 BPM</option><option value="cyberpunk">Cyberpunk · 100 BPM</option></select></div>
<div class="field"><label class="label">Vocal Range</label><select id="vocal"><option value="female">Middle</option><option value="male">Low</option><option value="child">High</option><option value="whistle">Whistle</option></select></div>
<div class="field"><label class="label">Scale</label><select id="scale"><option value="major">Major</option><option value="minor">Minor</option><option value="dorian">Dorian</option><option value="phrygian">Phrygian</option><option value="mixolydian">Mixolydian</option><option value="exotic">Neo-Soul</option></select></div>
<div class="field"><label class="label">Length</label><input id="length" value="short" placeholder="short or 30-180"></div>
</div></section>
<section class="panel"><h2>Mixer</h2><div class="mixer">
<label class="mix">Lead <input type="checkbox" id="mixVocal" checked></label><label class="mix">Piano <input type="checkbox" id="mixPiano" checked></label><label class="mix">Guitar <input type="checkbox" id="mixGuitar" checked></label><label class="mix">Drums <input type="checkbox" id="mixDrums" checked></label>
</div></section>
<div class="transport"><div class="buttons"><button id="play">Play</button><button id="stop" disabled>Stop</button><button id="record">Record & Download</button></div><div class="progress"><span id="bar"></span></div><div class="monitor"><span>Lead: <strong id="word">—</strong></span><span id="status">Ready</span></div></div>
</main>
<script>
const $=id=>document.getElementById(id), els={lyrics:$('lyrics'),beats:$('beats'),pitch:$('pitch'),genre:$('genre'),vocal:$('vocal'),scale:$('scale'),length:$('length'),mixVocal:$('mixVocal'),mixPiano:$('mixPiano'),mixGuitar:$('mixGuitar'),mixDrums:$('mixDrums')};
const P={l:196,m:293.66,h:440,do:261.63,re:293.66,mi:329.63,fa:349.23,so:392,la:440,di:493.88};
const scales={major:[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,218.27,261.63]],minor:[[220,261.63,329.63],[174.61,218.27,261.63],[293.66,349.23,440],[196,233.08,293.66]],dorian:[[220,261.63,329.63],[293.66,349.23,440],[196,246.94,293.66]],phrygian:[[164.81,196,246.94],[174.61,220,261.63],[196,246.94,293.66]],mixolydian:[[196,246.94,293.66],[146.83,174.61,220],[174.61,218.27,261.63]],exotic:[[220,277.18,329.63],[174.61,220,261.63],[246.94,311.13,369.99]]};
let ctx,dest,rec,chunks=[],playing=false,timers=[],startAt=0,total=0,raf=0;
function tokens(v){return v.trim()?v.trim().split(/\s+/):[]}
function validate(show=false){let a=tokens(els.lyrics.value),b=tokens(els.beats.value),c=tokens(els.pitch.value);$('lyricsCount').textContent=a.length;$('beatsCount').textContent=b.length;$('pitchCount').textContent=c.length;let ok=a.length>0&&a.length===b.length&&a.length===c.length;['lyricsCount','beatsCount','pitchCount'].forEach(id=>$(id).classList.toggle('bad',a.length>0&&!ok));$('error').classList.toggle('show',show&&!ok);$('error').textContent=a.length===0?'Add track data first.':`Track counts must match: ${a.length} lyrics / ${b.length} beats / ${c.length} pitch.`;return ok}
function save(){let o={};Object.entries(els).forEach(([k,e])=>o[k]=e.type==='checkbox'?e.checked:e.value);localStorage.setItem('miniStudioProject',JSON.stringify(o));$('saved').textContent='Saved locally'}
function load(){try{let o=JSON.parse(localStorage.getItem('miniStudioProject'));if(o)Object.entries(o).forEach(([k,v])=>{if(!els[k])return;els[k].type==='checkbox'?els[k].checked=v:els[k].value=v})}catch{}validate()}
Object.values(els).forEach(e=>e.addEventListener('input',()=>{validate();save()}));
function setup(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();dest=ctx.createMediaStreamDestination()}if(ctx.state==='suspended')ctx.resume()}
function route(node){node.connect(ctx.destination);if(dest)node.connect(dest)}
function tone(freq,dur,type='sine',vol=.06,pan=0){let o=ctx.createOscillator(),g=ctx.createGain(),p=ctx.createStereoPanner?ctx.createStereoPanner():null;o.type=type;o.frequency.value=Math.max(20,freq);g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+Math.max(.04,dur));o.connect(g);if(p){g.connect(p);p.pan.value=pan;route(p)}else route(g);o.start();o.stop(ctx.currentTime+Math.max(.05,dur))}
function drum(kind){if(!els.mixDrums.checked)return;if(kind==='kick'){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(120,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(35,ctx.currentTime+.13);g.gain.setValueAtTime(.28,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(g);route(g);o.start();o.stop(ctx.currentTime+.14)}else{let n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*.035,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=buf;let f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.035);n.connect(f).connect(g);route(g);n.start()}}
function matrix(){let w=tokens(els.lyrics.value),b=tokens(els.beats.value),p=tokens(els.pitch.value);return w.map((word,i)=>({word,beats:Math.max(.1,parseFloat(b[i])||1),freq:P[p[i].toLowerCase()]||P.m}))}
function bpm(){return {pop:120,hiphop:90,rock:135,lofi:75,synthwave:110,dnb:174,neosoul:84,cyberpunk:100}[els.genre.value]||120}
function stop(download=true){playing=false;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);$('play').disabled=false;$('record').disabled=false;$('stop').disabled=true;$('record').classList.remove('recording');$('record').textContent='Record & Download';$('bar').style.width='0';$('word').textContent='—';$('status').textContent='Ready';if(rec&&rec.state!=='inactive'){rec._download=download;rec.stop()}}
function progress(){if(!playing)return;let x=Math.min(1,(performance.now()-startAt)/(total*1000));$('bar').style.width=(x*100)+'%';if(x<1)raf=requestAnimationFrame(progress)}
function start(recording=false){if(playing||!validate(true))return;setup();let m=matrix(),spb=60/bpm(),requested=els.length.value.trim().toLowerCase();if(requested!=='short'){let target=Math.min(180,Math.max(30,parseInt(requested)||30)),base=[...m];while(m.reduce((s,x)=>s+x.beats*spb,0)<target)m=m.concat(base.map(x=>({...x})))}playing=true;$('play').disabled=true;$('record').disabled=true;$('stop').disabled=false;if(recording){chunks=[];rec=new MediaRecorder(dest.stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{if(rec._download===false)return;let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mini-studio-mix.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};rec.start();$('record').classList.add('recording');$('record').textContent='Recording…'}let offset=0,ch=scales[els.scale.value]||scales.major;m.forEach((s,i)=>{let dur=s.beats*spb,t=setTimeout(()=>{if(!playing)return;$('word').textContent=s.word==='_'?'[ REST ]':s.word;$('status').textContent=`${s.beats} beat · ${bpm()} BPM`;let mult={male:.5,female:1,child:2,whistle:4}[els.vocal.value]||1;if(s.word!=='_'&&els.mixVocal.checked)tone(s.freq*mult,dur,'triangle',.11);if(i%4===0){let chord=ch[Math.floor(i/4)%ch.length];if(els.mixPiano.checked)chord.forEach(f=>tone(f*.5,dur*1.8,'sine',.045,.4));if(els.mixGuitar.checked)chord.forEach((f,j)=>setTimeout(()=>playing&&tone(f,dur*.8,'triangle',.025,-.4),j*55))}drum(s.beats<1?'hat':'kick')},offset*1000);timers.push(t);offset+=dur});total=offset;startAt=performance.now();progress();timers.push(setTimeout(()=>stop(true),(total+.15)*1000))}
$('play').onclick=()=>start(false);$('record').onclick=()=>start(true);$('stop').onclick=()=>stop(true);load();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body></html>
