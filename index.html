<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Mini Studio</title><style>*{box-sizing:border-box}html,body{background:#000;color:#fff}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;padding:24px}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:1px solid #fff;padding-bottom:10px;margin-bottom:16px}.top h1{font-size:21px;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin:0}.sub,.label{font-size:11px;color:#888;letter-spacing:.55px;text-transform:uppercase}.panel{border:1px solid #fff;padding:14px;margin-bottom:14px}.panel h2{font-size:12px;color:#999;letter-spacing:1px;text-transform:uppercase;margin:0 0 10px}.guide{border:1px solid #555;margin-bottom:14px}.guide summary{padding:12px;cursor:pointer;font-size:12px;letter-spacing:.7px;text-transform:uppercase}.guide-body{padding:0 12px 12px;color:#aaa;font-size:12px;line-height:1.6}.guide-body code{color:#fff;background:#151515;padding:1px 4px}.tracks{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.track{min-width:0}.track-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.count{font:11px monospace;color:#777}.count.bad{color:#fff;text-decoration:underline}textarea,input,select{width:100%;border:1px solid #777;border-radius:0;background:#000;color:#fff;outline:none;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}textarea{height:260px;resize:vertical;padding:10px}textarea:focus,input:focus,select:focus{border-color:#fff}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;margin-bottom:5px}.field select,.field input{height:42px;padding:8px;font-family:inherit}.mixer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mix{border:1px solid #444;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.mix input{width:20px;height:20px;accent-color:#fff}.transport{position:sticky;bottom:0;background:rgba(0,0,0,.94);border:1px solid #fff;padding:10px;z-index:5}.buttons{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}button{min-height:44px;border:1px solid #fff;background:#000;color:#fff;text-transform:uppercase;letter-spacing:.8px;cursor:pointer}button:disabled{color:#555;border-color:#444}.recording{background:#fff;color:#000}.progress{height:3px;background:#222;margin-top:10px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:#fff}.monitor{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:12px ui-monospace,monospace;color:#999}.monitor strong{color:#fff}.error{display:none;margin-top:8px;font-size:12px}.error.show{display:block}.saved{font-size:10px;color:#666;text-transform:uppercase}@media(max-width:760px){body{padding:12px}.tracks{grid-template-columns:1fr}.track textarea{height:150px}.settings,.mixer{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:1fr 1fr}.buttons #record{grid-column:1/-1}}@media(max-width:390px){.settings,.mixer{grid-template-columns:1fr}.sub{display:none}}</style></head><body><main class="app"><header class="top"><div><h1>Mini Studio</h1><div class="sub">Browser audio sequencer</div></div><div class="saved" id="saved">Local autosave</div></header><details class="guide"><summary>How to / Cheatsheet</summary><div class="guide-body">Keep all three tracks aligned. Beats: <code>.25 .5 1 2 4</code>. Pitch: <code>do re mi fa so la di</code> or <code>L M H</code>. Scale now strongly shapes melody and harmony. Use <code>_</code> for rest.</div></details><section class="panel"><h2>Tracks</h2><div class="tracks"><div class="track"><div class="track-head"><span class="label">Lyrics</span><span class="count" id="lyricsCount">0</span></div><textarea id="lyrics"></textarea></div><div class="track"><div class="track-head"><span class="label">Beats</span><span class="count" id="beatsCount">0</span></div><textarea id="beats"></textarea></div><div class="track"><div class="track-head"><span class="label">Pitch</span><span class="count" id="pitchCount">0</span></div><textarea id="pitch"></textarea></div></div><div class="error" id="error"></div></section><section class="panel"><h2>Sound</h2><div class="settings"><div class="field"><label class="label">Genre</label><select id="genre"><option value="pop">Pop · 120 BPM</option><option value="hiphop">Hip-Hop · 90 BPM</option><option value="rock">Rock · 135 BPM</option><option value="lofi">Lo-Fi · 75 BPM</option><option value="synthwave">Synthwave · 110 BPM</option><option value="dnb">Drum & Bass · 174 BPM</option><option value="neosoul">Neo-Soul · 84 BPM</option><option value="cyberpunk">Cyberpunk · 100 BPM</option></select></div><div class="field"><label class="label">Vocal Range</label><select id="vocal"><option value="female">Middle</option><option value="male">Low</option><option value="child">High</option><option value="whistle">Whistle</option></select></div><div class="field"><label class="label">Scale</label><select id="scale"><option value="major">Major · bright</option><option value="minor">Minor · dark</option><option value="dorian">Dorian · soulful</option><option value="phrygian">Phrygian · tense</option><option value="mixolydian">Mixolydian · bluesy</option><option value="exotic">Neo-Soul · colorful</option></select></div><div class="field"><label class="label">Length</label><input id="length" value="short"></div></div></section><section class="panel"><h2>Mixer</h2><div class="mixer"><label class="mix">Lead <input type="checkbox" id="mixVocal" checked></label><label class="mix">Piano <input type="checkbox" id="mixPiano" checked></label><label class="mix">Guitar <input type="checkbox" id="mixGuitar" checked></label><label class="mix">Drums <input type="checkbox" id="mixDrums" checked></label></div></section><div class="transport"><div class="buttons"><button id="play">Play</button><button id="stop" disabled>Stop</button><button id="record">Record & Download</button></div><div class="progress"><span id="bar"></span></div><div class="monitor"><span>Lead: <strong id="word">—</strong></span><span id="status">Ready</span></div></div></main><script>
const $=id=>document.getElementById(id),els={lyrics:$('lyrics'),beats:$('beats'),pitch:$('pitch'),genre:$('genre'),vocal:$('vocal'),scale:$('scale'),length:$('length'),mixVocal:$('mixVocal'),mixPiano:$('mixPiano'),mixGuitar:$('mixGuitar'),mixDrums:$('mixDrums')};
const MODES={major:{notes:[0,2,4,5,7,9,11],accent:[2,5,6],prog:[0,4,5,3],wave:'triangle'},minor:{notes:[0,2,3,5,7,8,10],accent:[2,5,6],prog:[0,5,3,4],wave:'triangle'},dorian:{notes:[0,2,3,5,7,9,10],accent:[2,5,6],prog:[0,3,0,1],wave:'sine'},phrygian:{notes:[0,1,3,5,7,8,10],accent:[1,2,5],prog:[0,1,0,6],wave:'sawtooth'},mixolydian:{notes:[0,2,4,5,7,9,10],accent:[2,6,4],prog:[0,6,3,0],wave:'square'},exotic:{notes:[0,2,3,5,7,9,11],accent:[2,5,6],prog:[0,3,1,4],wave:'sine'}};
const DEG={do:0,re:1,mi:2,fa:3,so:4,sol:4,la:5,di:6,ti:6,l:0,m:2,h:4},root=261.6256;let ctx,dest,rec,chunks=[],playing=false,timers=[],startAt=0,total=0,raf=0;
function tokens(v){return v.trim()?v.trim().split(/\s+/):[]}function validate(show=false){let a=tokens(els.lyrics.value),b=tokens(els.beats.value),c=tokens(els.pitch.value);$('lyricsCount').textContent=a.length;$('beatsCount').textContent=b.length;$('pitchCount').textContent=c.length;let ok=a.length>0&&a.length===b.length&&a.length===c.length;['lyricsCount','beatsCount','pitchCount'].forEach(id=>$(id).classList.toggle('bad',a.length>0&&!ok));$('error').classList.toggle('show',show&&!ok);$('error').textContent=a.length?'Track counts must match.':'Add track data first.';return ok}function save(){let o={};Object.entries(els).forEach(([k,e])=>o[k]=e.type==='checkbox'?e.checked:e.value);localStorage.setItem('miniStudioProject',JSON.stringify(o));$('saved').textContent='Saved locally'}function load(){try{let o=JSON.parse(localStorage.getItem('miniStudioProject'));if(o)Object.entries(o).forEach(([k,v])=>{if(els[k])els[k].type==='checkbox'?els[k].checked=v:els[k].value=v})}catch{}validate()}Object.values(els).forEach(e=>e.addEventListener('input',()=>{validate();save()}));function setup(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();dest=ctx.createMediaStreamDestination()}if(ctx.state==='suspended')ctx.resume()}function route(n){n.connect(ctx.destination);if(dest)n.connect(dest)}function hz(s,o=0){return root*Math.pow(2,(s+12*o)/12)}
function degree(label,mode,i){let d=DEG[(label||'m').toLowerCase()];if(d===undefined)d=2;let m=MODES[mode];/* Every fourth phrase leans into the mode's characteristic tones so modes cannot collapse into the same melody. */if(i%4===2)d=m.accent[(Math.floor(i/4))%m.accent.length];return hz(m.notes[d])}function chord(mode,d){let s=MODES[mode].notes,r=[];for(let n of [0,2,4]){let x=d+n;r.push(hz(s[x%7],Math.floor(x/7)))}return r}
function tone(f,d,type='sine',v=.06,pan=0){let o=ctx.createOscillator(),g=ctx.createGain(),p=ctx.createStereoPanner?ctx.createStereoPanner():null;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(v,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+Math.max(.05,d));o.connect(g);if(p){g.connect(p);p.pan.value=pan;route(p)}else route(g);o.start();o.stop(ctx.currentTime+Math.max(.06,d))}function drum(k){if(!els.mixDrums.checked)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(k==='hat'?180:110,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(k==='hat'?90:35,ctx.currentTime+.1);g.gain.setValueAtTime(k==='hat'?.025:.16,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.11);o.connect(g);route(g);o.start();o.stop(ctx.currentTime+.12)}function bpm(){return{pop:120,hiphop:90,rock:135,lofi:75,synthwave:110,dnb:174,neosoul:84,cyberpunk:100}[els.genre.value]||120}
function matrix(){let w=tokens(els.lyrics.value),b=tokens(els.beats.value),p=tokens(els.pitch.value),mode=els.scale.value;return w.map((word,i)=>({word,beats:Math.max(.1,parseFloat(b[i])||1),freq:degree(p[i],mode,i)}))}function stop(dl=true){playing=false;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);$('play').disabled=false;$('record').disabled=false;$('stop').disabled=true;$('record').classList.remove('recording');$('record').textContent='Record & Download';$('bar').style.width='0';$('word').textContent='—';$('status').textContent='Ready';if(rec&&rec.state!=='inactive'){rec._download=dl;rec.stop()}}function progress(){if(!playing)return;let x=Math.min(1,(performance.now()-startAt)/(total*1000));$('bar').style.width=x*100+'%';if(x<1)raf=requestAnimationFrame(progress)}
function start(recording=false){if(playing||!validate(true))return;setup();let mode=els.scale.value,m=matrix(),spb=60/bpm(),req=els.length.value.trim().toLowerCase();if(req!=='short'){let target=Math.min(180,Math.max(30,parseInt(req)||30)),base=[...m];while(m.reduce((s,x)=>s+x.beats*spb,0)<target)m=m.concat(base.map(x=>({...x})))}playing=true;$('play').disabled=true;$('record').disabled=true;$('stop').disabled=false;if(recording){chunks=[];rec=new MediaRecorder(dest.stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{if(rec._download===false)return;let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mini-studio-mix.webm';a.click()};rec.start();$('record').classList.add('recording');$('record').textContent='Recording…'}let offset=0,md=MODES[mode];m.forEach((s,i)=>{let dur=s.beats*spb,t=setTimeout(()=>{if(!playing)return;$('word').textContent=s.word==='_'?'[ REST ]':s.word;$('status').textContent=mode.toUpperCase()+' · '+s.beats+' beat';let mult={male:.5,female:1,child:2,whistle:4}[els.vocal.value]||1;if(s.word!=='_'&&els.mixVocal.checked){tone(s.freq*mult,dur,md.wave,.15);/* quiet octave reinforces modal melody */tone(s.freq*mult*.5,dur,md.wave,.025)}if(i%4===0){let c=chord(mode,md.prog[Math.floor(i/4)%4]);if(els.mixPiano.checked)c.forEach(f=>tone(f*.5,dur*2,'sine',.075,.35));if(els.mixGuitar.checked)c.forEach((f,j)=>setTimeout(()=>playing&&tone(f,dur*.9,'triangle',.045,-.35),j*50))}drum(s.beats<1?'hat':'kick')},offset*1000);timers.push(t);offset+=dur});total=offset;startAt=performance.now();progress();timers.push(setTimeout(()=>stop(true),(total+.15)*1000))}
$('play').onclick=()=>start(false);$('record').onclick=()=>start(true);$('stop').onclick=()=>stop(true);load();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
